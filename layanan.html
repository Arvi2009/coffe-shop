<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KOPI TANGERANG - Layanan</title>
  <meta name="description" content="Tempat ngopi nyaman Tangerang, pesan kopi online Tangerang" />
  <meta name="keywords" content="tempat ngopi nyaman Tangerang, pesan kopi online Tangerang" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">KOPI TANGERANG</div>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="produk.html">Produk</a></li>
        <li><a href="layanan.html" class="active">Layanan</a></li>
        <li><a href="kontak.html">Kontak</a></li>
      </ul>
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section>
      <h2>Layanan Kami</h2>
      <ul>
        <li>Dine-In</li>
        <li>Take Away</li>
        <li>Delivery</li>
        <li>Reservasi Event</li>
      </ul>
    </section>
  </main>

  <div id="floating-cart" onclick="toggleCart()">🛒<span id="cart-count">0</span></div>
  <div id="cart-popup">
    <h3>Keranjang Kopi Anda</h3>
    <ul id="cart-items"></ul>
    <p>Total: <span id="cart-total">Rp0</span></p>
    <div class="delivery-option">
      <label><input type="radio" name="delivery" value="Delivery" checked> Delivery</label>
      <label><input type="radio" name="delivery" value="Takeaway"> Takeaway</label>
    </div>
    <div class="payment-option">
      <label><input type="radio" name="payment" value="Cash" checked> Cash</label>
      <label><input type="radio" name="payment" value="Transfer"> Transfer</label>
      <label><input type="radio" name="payment" value="E-Wallet"> E-Wallet</label>
    </div>
    <button onclick="checkout()">Checkout</button>
  </div>


  <script src="script.js"></script>
</body>
</html>
