<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KOPI TANGERANG - Kontak</title>
  <meta name="description" content="Hubungi kami di Jl. Raya Serpong No.88, Tangerang. No. HP & WA: 0812-3456-7890. Email: kontak@kopitangerang.com" />
  <meta name="keywords" content="hubungi kami Tangerang, kontak kopi Tangerang" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav>
      <div class="logo">KOPI TANGERANG</div>
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="produk.html">Produk</a></li>
        <li><a href="layanan.html">Layanan</a></li>
        <li><a href="kontak.html" class="active">Kontak</a></li>
      </ul>
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section>
      <h2>Hubungi Kami</h2>
      <p><strong>Alamat:</strong> Jl. Raya Serpong No.88, Tangerang</p>
      <p><strong>No. HP & WA:</strong> 0812-3456-7890</p>
      <p><strong>Email:</strong> <a href="mailto:kontak@kopitangerang.com">kontak@kopitangerang.com</a></p>

      <div style="margin: 20px 0;">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.1234567890123!2d106.60000000000001!3d-6.200000000000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69f123456789ab%3A0x123456789abcdef!2sJl.%20Raya%20Serpong%20No.88%2C%20Tangerang!5e0!3m2!1sen!2sid!4v1680000000000!5m2!1sen!2sid"
          width="100%"
          height="300"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <form id="contact-form" onsubmit="return validateForm()">
        <label for="name">Nama:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Pesan:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Kirim</button>
      </form>
    </section>
  </main>

  <div id="floating-cart" onclick="toggleCart()">🛒<span id="cart-count">0</span></div>
  <div id="cart-popup">
    <h3>Keranjang Kopi Anda</h3>
    <ul id="cart-items"></ul>
    <p>Total: <span id="cart-total">Rp0</span></p>
    <div class="delivery-option">
      <label><input type="radio" name="delivery" value="Delivery" checked> Delivery</label>
      <label><input type="radio" name="delivery" value="Takeaway"> Takeaway</label>
    </div>
    <div class="payment-option">
      <label><input type="radio" name="payment" value="Cash" checked> Cash</label>
      <label><input type="radio" name="payment" value="Transfer"> Transfer</label>
      <label><input type="radio" name="payment" value="E-Wallet"> E-Wallet</label>
    </div>
    <button onclick="checkout()">Checkout</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
